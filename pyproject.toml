[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mindustry-schematic-maker"
version = "1.0.0"
authors = [
    { name = "00000star", email = "starboy@users.noreply.github.com" },
]
description = "Automated closed-loop schematic generator, 3-tier static validator, and pure-Python supply simulator for Mindustry v7 Serpulo with zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Simulation",
    "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/00000star/mindustry-schematic-maker"
Repository = "https://github.com/00000star/mindustry-schematic-maker.git"
Issues = "https://github.com/00000star/mindustry-schematic-maker/issues"

[project.scripts]
msch = "msch:main"
